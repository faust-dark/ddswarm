[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddswarm"
version = "0.1.0"
description = "Drug discovery multi-agent swarm — deterministic in-silico pipeline with PDF reporting"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "rdkit>=2025.9", "reportlab>=4.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
docking = ["meeko>=0.8", "scipy", "gemmi", "pdbfixer", "openbabel-wheel"]

[project.scripts]
ddswarm = "ddswarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
